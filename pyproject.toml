[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sbc-tool"
version = "1.0.0"
description = "Sarvatobhadra Chakra - Vedic Market Timing Workstation"
readme = "README.md"
authors = [{name = "SBC Tool Contributors"}]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.0,<4.0.0",
    "pyswisseph>=2.10.0,<3.0.0",
    "pandas>=2.1.0,<4.0.0",
    "numpy>=1.26.0,<3.0.0",
    "yfinance>=0.2.40,<2.0.0",
    "requests>=2.31.0,<3.0.0",
    "timezonefinder>=6.4.0,<9.0.0",
    "python-dateutil>=2.8.2,<3.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "python-docx>=1.1.0,<2.0.0",
    "matplotlib>=3.8.0,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<10.0.0",
    "pytest-cov>=4.1.0,<8.0.0",
    "pytest-mock>=3.12.0,<4.0.0",
    "ruff>=0.6.0,<1.0.0",
    "mypy>=1.6.0,<2.0.0",
    "types-requests>=2.31.0",
    "types-pytz>=2024.1",
    "gunicorn>=21.2.0,<24.0.0",
]
# Headless UI smoke test (tests/ui); also run `playwright install chromium`.
ui = [
    "playwright>=1.45,<2.0",
]
docs = [
    "sphinx>=7.2.0,<8.0.0",
    "sphinx-rtd-theme>=1.3.0,<2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sbc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.black]
line-length = 100
target-version = ['py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | venv-py314
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "venv",
    "venv-py314",
    "scripts/adhoc",  # one-off research/debug scripts, not maintained
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting (replaces isort)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "T20", # flake8-print
]
ignore = [
    "E501",    # line length: not enforced (no formatter run over the codebase)
    "B008",    # function calls in default arguments
    # Style preferences, not defects; existing code uses these idioms freely.
    "E701",    # `if x: y` on one line
    "E702",    # `a; b` on one line
    "E731",    # assigning a lambda to a name
    "B905",    # zip() without strict=
    "UP031",   # %-style string formatting
    "SIM105",  # try/except/pass instead of contextlib.suppress
    "SIM108",  # if/else block instead of a ternary
]

[tool.ruff.lint.per-file-ignores]
# CLI scripts print by design and put the repo root on sys.path before imports.
"scripts/*.py" = ["T201", "E402"]
# Modules with a __main__ command-line entry point.
"sbc/{astro_plot,bullion_vedha,crash_analyzer,kp_intraday,transit_vedha,transits,weekly_commentary}.py" = ["T201"]
"sbc/navamsa_pipeline/cli.py" = ["T201"]
"tests/*.py" = ["E402", "T201"]

[tool.ruff.lint.isort]
known-first-party = ["sbc", "app"]

[tool.mypy]
# CI and the Docker image run 3.12; numpy >= 2.5 ships stubs with 3.12-only syntax.
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
namespace_packages = true
exclude = [
    "venv",
    "venv-py314",
    "tests",
    "scripts",
]

[tool.coverage.run]
source = ["sbc"]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/venv-py314/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
precision = 2
show_missing = true

[tool.setuptools.package-dir]
"" = "."