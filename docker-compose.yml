services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sbc-tool
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - FLASK_ENV=production
      - FLASK_APP=app.py
      # Required for any non-GET request that does not come from localhost.
      # Generate one with:  python -c "import secrets; print(secrets.token_urlsafe(32))"
      - SBC_API_TOKEN=${SBC_API_TOKEN:?set SBC_API_TOKEN before starting}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: sbc-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: sbc-nav-postgres
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      - POSTGRES_DB=navigator
      - POSTGRES_USER=navigator
      - POSTGRES_PASSWORD=${NAV_PG_PASSWORD:?set NAV_PG_PASSWORD in .env}
    volumes:
      - nav_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  nav_pgdata: {}
