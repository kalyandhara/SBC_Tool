name: CI/CD Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install "ruff>=0.6.0,<1.0.0"

      # ruff covers pyflakes, pycodestyle, import sorting (isort) and bugbear;
      # rules and exclusions live in pyproject.toml [tool.ruff].
      - name: Run ruff
        run: ruff check sbc/ app.py run_app.py scripts/ tests/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.lock
          pip install -e ".[dev]"

      - name: Run mypy
        run: mypy sbc/ app.py --ignore-missing-imports

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.lock
          pip install -e ".[dev]"

      - name: Run pytest with coverage
        run: |
          pytest --cov=sbc --cov-report=xml --cov-report=term-missing -v

  test-api:
    name: API Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.lock
          pip install -e ".[dev]"

      - name: Start the app and wait for /healthz
        run: |
          python run_app.py --host 127.0.0.1 --port 5000 --no-warm --no-ledger &
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:5000/healthz && exit 0
            sleep 1
          done
          echo "app did not become healthy within 30 s" && exit 1

      - name: Run API tests
        run: |
          pytest tests/test_api.py tests/test_integration.py -v

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    # Build on PRs too, so a broken image is caught before it reaches master.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: sbc-tool:latest
          load: true

      - name: Test Docker image
        run: |
          docker run --rm -d -p 8000:8000 --name sbc-test sbc-tool:latest
          for i in $(seq 1 60); do
            curl -fs http://localhost:8000/healthz && break
            sleep 2
          done
          curl -f http://localhost:8000/healthz || { docker logs sbc-test; exit 1; }
          # The image's own HEALTHCHECK must turn healthy as well.
          for i in $(seq 1 30); do
            state=$(docker inspect -f '{{.State.Health.Status}}' sbc-test)
            [ "$state" = healthy ] && break
            sleep 3
          done
          echo "container health: $state"
          [ "$state" = healthy ] || { docker logs sbc-test; exit 1; }
          docker stop sbc-test

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.lock

      - name: Run bandit
        run: |
          pip install bandit
          bandit -r sbc/ app.py -f json -o bandit-report.json || true

  release:
    name: Create Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [lint, typecheck, test, test-api, docker, security]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
